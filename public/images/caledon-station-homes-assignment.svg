<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Caledon Station Homes assignment policy timeline</title>
  <rect width="1600" height="900" fill="#F7F5F1"/>
  <text x="80" y="90" fill="#C98A3B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="0.16em">ONTARIO PRE-CONSTRUCTION · GENERAL MECHANICS</text>
  <text x="80" y="150" fill="#14213D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="600">Assignment is a contract sale, not a closing</text>
  <path d="M120 430 H1480" stroke="#14213D" stroke-width="4"/>
  <g fill="#C98A3B">
    <circle cx="220" cy="430" r="16"/>
    <circle cx="560" cy="430" r="16"/>
    <circle cx="900" cy="430" r="16"/>
    <circle cx="1240" cy="430" r="16"/>
  </g>
  <text x="160" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#14213D">1. Sign APS</text>
  <text x="480" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#14213D">2. Builder consent?</text>
  <text x="820" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#14213D">3. Assignment fee</text>
  <text x="1160" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#14213D">4. Close or assign</text>
  <rect x="80" y="560" width="1440" height="220" fill="#EFEBE3" stroke="#DAD5C9"/>
  <text x="110" y="630" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#14213D">Caledon Station Homes assignment policy: not yet published by the builder as of August 2026.</text>
  <text x="110" y="680" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#5B6478">Ontario assignment terms live in each projects Agreement of Purchase and Sale. Do not assume a right to assign.</text>
</svg>
