<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Pre-construction investment Caledon  Peel Region 2026</title>
  <rect width="1600" height="900" fill="#EFEBE3"/>
  <rect x="0" y="0" width="1600" height="160" fill="#0B1526"/>
  <text x="80" y="70" fill="#C98A3B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="0.18em">2026 INVESTOR GUIDE</text>
  <text x="80" y="120" fill="#F7F5F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="600">Pre-construction investment in Caledon</text>
  <rect x="80" y="220" width="440" height="280" fill="#F7F5F1" stroke="#DAD5C9"/>
  <rect x="580" y="220" width="440" height="280" fill="#F7F5F1" stroke="#DAD5C9"/>
  <rect x="1080" y="220" width="440" height="280" fill="#F7F5F1" stroke="#DAD5C9"/>
  <text x="110" y="280" fill="#14213D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Official-plan growth</text>
  <text x="110" y="340" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">300,000 people / 125,000 jobs</text>
  <text x="110" y="375" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">by 2051 (Peel plan, 2022)</text>
  <text x="610" y="280" fill="#14213D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Project screen</text>
  <text x="610" y="340" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Price · deposit · fees</text>
  <text x="610" y="375" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Assignment clause · occupancy</text>
  <text x="1110" y="280" fill="#14213D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Worked example</text>
  <text x="1110" y="340" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Caledon Station Homes</text>
  <text x="1110" y="375" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">4,042 homes · numbers TBA</text>
  <text x="80" y="600" fill="#14213D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Municipal growth is shared. Contract terms are not. Underwrite the file, not the town name.</text>
  <text x="80" y="820" fill="#5B6478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Independent research illustration. Not a builder rendering.</text>
